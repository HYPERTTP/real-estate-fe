<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a2540" />

    <!-- ─── SEO Meta Tags ─────────────────────────────────────────── -->
    <title>Free Home Valuation | Minhas Realty — GTA Real Estate</title>
    <meta
      name="description"
      content="Find out what your home is worth today. Get a free, instant home valuation from Minhas Realty — trusted GTA real estate professionals. No commitment required."
    />
    <meta
      name="keywords"
      content="home valuation, house worth, GTA real estate, Toronto homes, free home estimate, Minhas Realty, sell my home, property value"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.minhasrealty.ca/" />

    <!-- ─── Open Graph (Facebook / LinkedIn) ─────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.minhasrealty.ca/" />
    <meta property="og:title" content="Free Home Valuation | Minhas Realty" />
    <meta
      property="og:description"
      content="Discover what your GTA home is worth. Instant, data-driven estimate from a trusted local realtor."
    />
    <meta
      property="og:image"
      content="https://www.minhasrealty.ca/og-image.jpg"
    />
    <meta property="og:locale" content="en_CA" />

    <!-- ─── Twitter Card ──────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free Home Valuation | Minhas Realty" />
    <meta
      name="twitter:description"
      content="Discover what your GTA home is worth. Instant, data-driven estimate from a trusted local realtor."
    />
    <meta
      name="twitter:image"
      content="https://www.minhasrealty.ca/og-image.jpg"
    />

    <!-- ─── Local Business Structured Data (JSON-LD) ─────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "Minhas Realty",
        "url": "https://www.minhasrealty.ca",
        "telephone": "+1-647-555-1234",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Toronto",
          "addressRegion": "ON",
          "addressCountry": "CA"
        },
        "description": "Trusted GTA real estate professionals offering free, instant home valuations.",
        "areaServed": {
          "@type": "City",
          "name": "Greater Toronto Area"
        }
      }
    </script>

    <!-- ─── Fonts ──────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
